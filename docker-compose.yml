services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tradelens
      POSTGRES_USER: tradelens
      POSTGRES_PASSWORD: tradelens
    volumes:
      - tradelens-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradelens"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://tradelens:tradelens@db:5432/tradelens
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: local-dev-secret-change-me-please-0123456789
    depends_on:
      db:
        condition: service_healthy

volumes:
  tradelens-pg:
